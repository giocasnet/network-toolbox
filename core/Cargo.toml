[package]
name = "ntb-core"
description = "Network Toolbox core: network diagnostics logic (ping, traceroute, scans, DNS, TLS, SNMP, Wi-Fi...), independent of the UI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "process"] }
ipnet = "2"
if-addrs = "0.13"
serde_json = "1"
# Password generator: system cryptographic randomness (ProcessPrng on Windows)
getrandom = "0.2"
# DNS: message building and parsing (direct queries to any server) and
# reading the system DNS configuration (servers and search suffixes)
hickory-proto = { version = "0.24", default-features = false }
hickory-resolver = { version = "0.24", default-features = false, features = ["system-config", "tokio-runtime"] }
# HTTP: on Windows uses SChannel and the Windows certificate store
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
# TLS: handshake with rustls ("ring" crypto: on Windows the MSVC compiler is enough),
# verification with the system certificate store, certificate parsing
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.5"
x509-parser = "0.16"
# SNMPv3 (USM): HMAC and encryption in pure Rust, no OpenSSL
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
des = "0.8"
cfb-mode = "0.8"
cbc = "0.1"
# Used only on Windows (ICMP, ARP). It is an unconditional dependency because the Windows
# code must also be checkable from Linux with --cfg ntb_check_windows.
# Clipboard (password generator): Win32_System_DataExchange and Win32_System_Memory;
# route and adapter of the home screen (GetBestRoute, GetIfEntry2): WinSock and Ndis;
# scans (IcmpSendEcho2Ex on a dedicated thread, WSAIoctl): System_IO and System_Threading;
# Wi-Fi (wlanapi.dll loaded at runtime): NetworkManagement_WiFi and System_LibraryLoader;
# certificate chain built by Windows (CertGetCertificateChain): Security_Cryptography
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_System_IO", "Win32_System_Threading", "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ntb_check_windows)"] }
