# Net-SNMP test agent for snmp::tests::agente_vero (NTB_SNMP_TEST=16100)
agentAddress udp:127.0.0.1:16100
rocommunity public 127.0.0.1
sysName test-agent
sysLocation Sala server
sysContact it@example.test
createUser u_none
createUser u_md5 MD5 authpass123
createUser u_md5des MD5 authpass123 DES privpass123
createUser u_shaaes SHA authpass123 AES privpass123
createUser u_sha224 SHA-224 authpass123 AES privpass123
createUser u_sha256aes SHA-256 authpass123 AES privpass123
createUser u_sha384 SHA-384 authpass123 DES privpass123
createUser u_sha512aes SHA-512 authpass123 AES privpass123
rouser u_none noauth
rouser u_md5 auth
rouser u_md5des priv
rouser u_shaaes priv
rouser u_sha224 priv
rouser u_sha256aes priv
rouser u_sha384 priv
rouser u_sha512aes priv
